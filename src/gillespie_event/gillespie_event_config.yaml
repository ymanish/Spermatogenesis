# Local single-run default for the event-driven Gillespie pipeline.
# (The cluster sweep uses cluster_sim_scripts/gillespie_event/gillespie_event_sweep.yaml.)
# Variable names are kept consistent with the Markov pipeline
# (src/markov_execution/markov_config.yaml): tau_max / tau_steps / tau_spacing /
# tau_log_min, prot_k_bind / prot_k_unbind, batch_size / n_workers / max_nucs.

# ── Input / Output ───────────────────────────────────────────────────────────
dataset_dir: /home/pol_schiessel/maya620d/pol/Projects/Codebase/Spermatogensis/SPRM_data/ret_all_stable147_refined
storage_dir: /home/pol_schiessel/maya620d/pol/Projects/Codebase/Spermatogensis/SPRM_output/gillespie_event
dataset:     ret_all_stable147_refined

# ── Nucleosome parameters ────────────────────────────────────────────────────
# k_wrap is intentionally omitted -> CLI default 1.0, i.e. the simulator runs in
# dimensionless time tau = k_wrap_phys * t (physical rewrap rate ~21/s, Tims 2011).
binding_sites: 14

# ── Protamine parameters ─────────────────────────────────────────────────────
prot_k_unbind:      89.7
prot_k_bind:        1.0
prot_p_conc:        0.01
prot_cooperativity: 4.5

# ── Time / sampling (match the Markov log tau grid) ──────────────────────────
tau_max:     20000.0
tau_steps:   1000
tau_spacing: log
tau_log_min: 0.01

# ── Simulation behavior ──────────────────────────────────────────────────────
inf_protamine: true
replicates:    10

# ── Execution ────────────────────────────────────────────────────────────────
batch_size:  1
n_workers:   20
flush_every: 10000

# ── Output ───────────────────────────────────────────────────────────────────
save_trajectories: true

# ── Testing ──────────────────────────────────────────────────────────────────
max_nucs: 20

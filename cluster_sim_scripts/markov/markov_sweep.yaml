# Markov sweep + cluster solver config (single source of truth).
#
# Consumed by:
#   - cluster_sim_scripts/markov/generate_sweep_grid.py
#         reads: sprm_root, storage_root, sweep.{datasets, prot_p_conc, prot_cooperativity}
#   - src.markov_execution.cli via --config (from launch_markov_sweep.job)
#         reads: all top-level Markov solver keys (k_wrap, tau_max, method, ...)
#         silently ignores: sprm_root, storage_root, sweep
#
# Per-task overrides supplied by launch_markov_sweep.job from sweep_grid.tsv:
#   --dataset_dir, --storage_dir, --prot_p_conc, --prot_cooperativity, --n_workers
#
# Workflow (sweep_grid.tsv is a COMMITTED artifact — regenerate locally):
#   # locally (laptop/workstation with python3 + pyyaml):
#   1. Edit this file
#   2. python cluster_sim_scripts/markov/generate_sweep_grid.py --no-validate
#   3. git add markov_sweep.yaml sweep_grid.tsv && git commit && git push
#   # on the cluster:
#   4. git pull
#   5. ./cluster_sim_scripts/markov/submit_sweep.sh

# ── Sweep specification (read by generate_sweep_grid.py) ─────────────────────
sprm_root: /group/pol_schiessel/Manish/HAMNucRetSeq_pipeline/SPRM_data
storage_root: /group/pol_schiessel/Manish/Spermatogensis/output/markov_sweep_stable147_v1_two_adsorption_gth

E_out: 6.70
E_in: 10.50
sweep:
  datasets:
    - ctrl01_random_genome_safe_stable147_refined_Eout_{E_out:.2f}_Ein{E_in:.2f}
    - ctrl02_random_genome_gcmatched_stable147_refined_Eout_{E_out:.2f}_Ein{E_in:.2f}
    - ctrl03_som_gcmatched_stable147_refined_Eout_{E_out:.2f}_Ein{E_in:.2f}
    - ctrl04_bound_prom_evicted_stable147_refined_Eout_{E_out:.2f}_Ein{E_in:.2f}
    - ctrl05_unbound_prom_yazdi_stable147_refined_Eout_{E_out:.2f}_Ein{E_in:.2f}
    - ret_all_stable147_refined_Eout_{E_out:.2f}_Ein{E_in:.2f}

  prot_p_conc:        [0.0, 0.01, 0.1, 1.0, 3.0, 10.0, 20.0, 50.0, 65.0, 100.0, 1000.0]
  prot_cooperativity: [0.0, 4.5]

# ── Markov solver defaults (read by the Markov CLI via --config) ─────────────
# Per-task values are supplied by the .job script — left null here.
dataset_dir: null
storage_dir: null

# Nucleosome parameters
k_wrap: 21.0
binding_sites: 14

# Protamine kinetics (prot_p_conc / prot_cooperativity are NOT declared at top
# level here — they live inside `sweep` and are passed per-task by the .job.)
#
# NOTE: the reduced (fast-protamine) model depends ONLY on the ratio
#   c0 = prot_k_unbind / prot_k_bind
# through betamu = ln(prot_p_conc * prot_k_bind / prot_k_unbind); the individual
# on/off rates never enter. prot_k_bind is fixed to 1.0 so prot_k_unbind == c0.
# Both keys are retained (rather than collapsed to a single c0) to keep the
# storage schema and parameters.json stable for downstream analysis.
prot_k_unbind: 89.7
prot_k_bind: 1.0

# Computation
tau_max: 100000.0
tau_steps: 1000
# Survival-curve tau grid: 'log' concentrates points where S(tau) drops and is
# sparse in the smooth tail (better shape + Gillespie comparison at far fewer
# points); 'linear' for uniform spacing. Does NOT affect the MFPT (a direct
# linear solve). tau_log_min is the smallest nonzero tau on the log grid.
tau_spacing: log
tau_log_min: 0.01
method: ode
# MFPT solver. 'gth' (Grassmann-Taksar-Heyman state reduction) is exact to
# machine precision at any stiffness. 'lu' is the previous solver, which lost
# the slow unwrapping rate when the generator diagonal was formed and returned
# either inf or values up to 24 decades too small, flagged 'ok'.
mfpt_method: gth
sparse: false

# Execution (n_workers overridden by $SLURM_NTASKS in the .job)
batch_size: 50
n_workers: 20

# Output
save_survival: true
save_states: false
save_mfpt: true

# Testing / debugging
max_nucs: null
